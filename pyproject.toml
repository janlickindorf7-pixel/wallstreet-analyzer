[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock_pipeline"
version = "0.1.0"
description = "Pipeline pobierający dane o spółkach S&P 500 i wybierający top 10 po kapitalizacji"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "yfinance",
    "lxml",
    "python-dotenv",
]

[project.optional-dependencies]
app = ["streamlit", "plotly"]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/stock_pipeline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"